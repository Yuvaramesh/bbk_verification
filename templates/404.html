{% extends "base.html" %}

{% block title %}Page Not Found - Verification System{% endblock %}

{% block content %}
<div style="text-align: center; padding: 3rem;">
    <h1 style="font-size: 4rem; color: #ef4444; margin-bottom: 1rem;">404</h1>
    <h2 style="color: #6b7280; margin-bottom: 1rem;">Page Not Found</h2>
    <p style="color: #9ca3af; margin-bottom: 2rem;">The page you're looking for doesn't exist.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Go to Dashboard</a>
</div>
{% endblock %}
